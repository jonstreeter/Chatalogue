# The universal merge gate. Harness automation can be disabled, uninstalled, or
# simply absent; this cannot be skipped from a workstation, so it is the only
# enforcement the kit actually relies on.
name: sdd

on:
  push:
  pull_request:

jobs:
  sdd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test deps
        run: python -m pip install pytest

      - name: SDD documentation validation
        run: python scripts/check_sdd_docs.py validate

      - name: SDD script tests
        run: python -m pytest tests -q

      # Secret scanning runs here too: a pre-commit hook only protects people
      # who installed it.
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ github.token }}

      # Contract-impact acknowledgement. On a PR the ack comes from the PR body.
      # On a direct push -- the normal solo-dev path -- it comes from the commit
      # messages in the push, so pushing to the default branch is not a way to
      # route around the gate.
      - name: Contract-impact gate (pull request)
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          printf '%s' "$PR_BODY" > ack.txt
          python scripts/check_sdd_docs.py impact \
            --base ${{ github.event.pull_request.base.sha }} --ack-file ack.txt

      - name: Contract-impact gate (push)
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        run: |
          git log --format=%B ${{ github.event.before }}..${{ github.sha }} > ack.txt
          python scripts/check_sdd_docs.py impact \
            --base ${{ github.event.before }} --ack-file ack.txt

  # ------------------------------------------------------------------------
  # This project's own CI. Commands mirror AGENTS.md "Canonical Commands".
  # ------------------------------------------------------------------------
  project:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Python lint
        run: pip install ruff==0.15.20 && ruff check backend

      - name: Frontend typecheck
        working-directory: frontend
        run: npx tsc -b
      # Frontend eslint (npm run lint) intentionally NOT wired: the repo's
      # existing lint.yml never ran it, and it currently fails on pre-existing
      # debt (unused vars, `any` types). Add it back after that debt is cleared.
